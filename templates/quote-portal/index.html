<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{{CLIENT_NAME}} - Online Service Quote Portal</title>
  <style>
    :root {
      --primary: #00f3ff;
      --primary-glow: rgba(0, 243, 255, 0.35);
      --bg-dark: #070a12;
      --bg-card: rgba(15, 23, 42, 0.85);
      --border: rgba(255, 255, 255, 0.15);
      --text: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg-dark); color: var(--text); font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 2rem; }
    .header h1 { font-size: 2rem; color: #fff; background: linear-gradient(135deg, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header p { color: #94a3b8; font-size: 0.95rem; margin-top: 0.5rem; }
    
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    
    .card { background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .card h2 { font-size: 1.2rem; margin-bottom: 1rem; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
    
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 0.35rem; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 0.75rem 1rem; background: rgba(10, 15, 26, 0.9); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; transition: all 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }
    
    .btn { background: linear-gradient(135deg, var(--primary), #0284c7); color: #000; font-weight: 800; border: none; padding: 0.85rem 1.5rem; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1rem; transition: transform 0.2s, box-shadow 0.2s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 0 20px var(--primary-glow); }
    
    .lead-item { background: rgba(10, 15, 26, 0.7); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-bottom: 0.75rem; }
    .lead-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .lead-name { font-weight: bold; color: #fff; }
    .badge { font-size: 0.75rem; padding: 0.25rem 0.6rem; border-radius: 999px; background: rgba(0, 243, 255, 0.15); color: var(--primary); border: 1px solid var(--primary-glow); font-weight: bold; }
    .est-price { font-size: 1.1rem; font-weight: 800; color: #10b981; font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>{{CLIENT_NAME}}</h1>
      <p>Instant Online Service Quote & Dispatch Portal</p>
    </div>

    <div class="grid">
      <!-- Intake Form -->
      <div class="card">
        <h2>Submit Service Request</h2>
        <form id="intakeForm">
          <div class="form-group">
            <label>Customer Full Name</label>
            <input type="text" id="custName" placeholder="e.g. Marcus Vance" required />
          </div>

          <div class="form-group">
            <label>Phone Number (Auto-Formatting)</label>
            <input type="text" id="custPhone" placeholder="(480) 555-0199" required />
          </div>

          <div class="form-group">
            <label>Service Category</label>
            <select id="serviceCategory">
              <option value="Standard Inspection">Standard Service Inspection ($150)</option>
              <option value="System Repair">System Repair & Diagnostic ($450)</option>
              <option value="Full System Replacement">Full System Replacement ($4,500+)</option>
              <option value="Emergency Service">Emergency Service Request ($350)</option>
            </select>
          </div>

          <div class="form-group">
            <label>City Location</label>
            <select id="custCity">
              <option value="Mesa">Mesa</option>
              <option value="Gilbert">Gilbert</option>
              <option value="Chandler">Chandler</option>
              <option value="Tempe">Tempe</option>
              <option value="Phoenix">Phoenix</option>
            </select>
          </div>

          <div class="form-group">
            <label>Notes & Equipment Details</label>
            <textarea id="custNotes" rows="3" placeholder="Describe equipment age, leak location, noise, etc..."></textarea>
          </div>

          <button type="submit" class="btn">Generate Estimate & Submit</button>
        </form>
      </div>

      <!-- Live Dispatcher Board -->
      <div class="card">
        <h2>Live Dispatcher Operations Board</h2>
        <div id="leadsList">
          <div style="text-align: center; color: #64748b; padding: 2rem;">Loading active leads...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api/leads';

    // Phone Auto Formatter
    document.getElementById('custPhone').addEventListener('input', function(e) {
      let cleaned = e.target.value.replace(/\D/g, '');
      if (cleaned.length > 10) cleaned = cleaned.slice(0, 10);
      if (cleaned.length <= 3) e.target.value = cleaned;
      else if (cleaned.length <= 6) e.target.value = `(${cleaned.slice(0,3)}) ${cleaned.slice(3)}`;
      else e.target.value = `(${cleaned.slice(0,3)}) ${cleaned.slice(3,6)}-${cleaned.slice(6)}`;
    });

    async function fetchLeads() {
      try {
        const res = await fetch(API_URL);
        const leads = await res.json();
        const container = document.getElementById('leadsList');
        if (leads.length === 0) {
          container.innerHTML = '<div style="text-align: center; color: #64748b; padding: 2rem;">No active leads yet. Submit a request on the left.</div>';
          return;
        }
        container.innerHTML = leads.map(l => `
          <div class="lead-item">
            <div class="lead-header">
              <span class="lead-name">${l.name} <small style="color: #64748b; font-weight: normal;">(${l.city})</small></span>
              <span class="badge">${l.status}</span>
            </div>
            <div style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.5rem;">📱 ${l.phone} • ${l.service}</div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="font-size: 0.8rem; color: #64748b; italic;">"${l.notes || 'No extra notes'}"</span>
              <span class="est-price">$${l.estimated_cost.toLocaleString()}</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Failed to load leads', err);
      }
    }

    document.getElementById('intakeForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('custName').value,
        phone: document.getElementById('custPhone').value,
        service: document.getElementById('serviceCategory').value,
        city: document.getElementById('custCity').value,
        notes: document.getElementById('custNotes').value
      };

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      document.getElementById('custName').value = '';
      document.getElementById('custPhone').value = '';
      document.getElementById('custNotes').value = '';
      fetchLeads();
    });

    fetchLeads();
    setInterval(fetchLeads, 5000);
  </script>
</body>
</html>
